<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vô Juca, Cafés Artesanais do Sul de Minas</title>
    <meta name="description" content="Café 100% arábica plantado, colhido, torrado e moído na mesma propriedade, em Santa Rita do Sapucaí. Quatro gerações da mesma família." />
    <meta name="theme-color" content="#efe3cc" />

    <!-- Só o busto do Juca, recortado de dentro do selo e ampliado até encher
         o disco: os anéis, o nome e os ramos viravam ruído no tamanho em que a
         aba mostra o ícone, e o que resta de reconhecível ali é o chapéu e o
         rosto. O canto é transparente, então na aba ele aparece redondo e não
         como um quadradinho bege; o papel continua dentro do círculo porque a
         tinta é escura e sumiria numa aba de tema escuro.
         Nos tamanhos pequenos a arte leva um pouco de contraste: a gravura é
         de traço fino e, reduzida, a média dos traços puxa tudo para o creme.
         O ícone da Apple é a exceção quadrada: o iOS recorta sozinho e pinta
         de preto o que for transparente. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- O Chrome e o Samsung Internet no Android, com o tema escuro do celular
         ligado, reescrevem sozinhos as cores de qualquer página que não diga
         qual esquema usa: o creme vira oliva escuro, o brasão some no fundo.
         "only light" é a instrução explícita de não fazer isso. O site é uma
         folha de papel; não existe versão escura dele para o navegador supor. -->
    <meta name="color-scheme" content="only light" />

    <!-- O link do site é colado no WhatsApp, que é o canal de venda. Sem estas
         tags ele chega lá como uma linha de texto azul, sem imagem, sem título
         e sem descrição. A imagem é a mesma composição da capa, em 1200x630,
         que é o formato que o WhatsApp, o Facebook e o LinkedIn recortam. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sitevojuca.vercel.app/" />
    <meta property="og:site_name" content="Vô Juca" />
    <meta property="og:title" content="Vô Juca, Cafés Artesanais do Sul de Minas" />
    <meta property="og:description" content="Café 100% arábica plantado, colhido, torrado e moído na mesma propriedade, em Santa Rita do Sapucaí. Quatro gerações da mesma família." />
    <meta property="og:image" content="https://sitevojuca.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O selo do Vô Juca sobre a lavoura ao fim da tarde, no Sul de Minas" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vô Juca, Cafés Artesanais do Sul de Minas" />
    <meta name="twitter:description" content="Café 100% arábica plantado, colhido, torrado e moído na mesma propriedade, em Santa Rita do Sapucaí. Quatro gerações da mesma família." />
    <meta name="twitter:image" content="https://sitevojuca.vercel.app/og-image.jpg" />
    <link rel="canonical" href="https://sitevojuca.vercel.app/" />

    <!-- As fontes vinham por @import dentro do CSS, o que obriga o navegador a
         baixar o CSS, ler, descobrir o @import e só então pedir as fontes: três
         viagens em fila antes da primeira letra. Declaradas aqui, o pedido sai
         junto com o resto, e o preconnect já abre a conexão com o servidor de
         fontes enquanto o HTML ainda está sendo lido. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,400..600,0..100&family=Karla:wght@400..700&family=Courier+Prime:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
